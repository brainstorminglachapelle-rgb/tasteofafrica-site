<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>That table isn't here — Taste of Africa</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12100D">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #12100D;
    color: #F7F2E8;
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 32px;
    box-sizing: border-box;
    text-align: center;
  }
  .mark {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #E8A33D;
    margin: 0 auto 22px;
  }
  h1 { margin: 0; font: 800 clamp(30px, 6vw, 46px)/1.02 inherit; letter-spacing: -.02em; }
  p { margin: 12px 0 0; font: 500 15px/1.55 inherit; color: rgba(247, 242, 232, .66); }
  a {
    display: inline-block;
    margin-top: 26px;
    padding: 15px 22px;
    border-radius: 9px;
    background: #B4451F;
    color: #FBF6EC;
    font: 800 14px/1 inherit;
    letter-spacing: .06em;
    text-transform: uppercase;
    text-decoration: none;
  }
  a:hover { background: #C9552C; }
  .stamp {
    margin-top: 34px;
    font: 500 10.5px/1 'IBM Plex Mono', ui-monospace, monospace;
    letter-spacing: .14em;
    color: rgba(247, 242, 232, .38);
  }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>That table isn't here.</h1>
    <p>The page you were looking for never made it out of the kitchen.</p>
    <a href="/">Back to the restaurant</a>
    <p class="stamp">ERROR 404 · ORDER NOT FOUND</p>
  </main>
</body>
</html>
