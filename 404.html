<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>That table isn't here — Taste of Africa</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2EADC">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #F2EADC;
    color: #16120E;
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 32px;
    box-sizing: border-box;
    text-align: center;
  }
  .mark {
    display: block;
    width: 84px; height: 84px;
    border-radius: 50%;
    margin: 0 auto 26px;
    box-shadow: 0 0 0 1px rgba(22, 18, 14, .10);
  }
  h1 { margin: 0; font: 800 clamp(30px, 6vw, 46px)/1.02 inherit; letter-spacing: -.02em; }
  p { margin: 12px 0 0; font: 500 15px/1.55 inherit; color: rgba(22, 18, 14, .72); }
  a {
    display: inline-block;
    margin-top: 26px;
    padding: 15px 22px;
    border-radius: 9px;
    background: #B4451F;
    color: #FBF6EC;
    font: 800 14px/1 inherit;
    letter-spacing: .06em;
    text-transform: uppercase;
    text-decoration: none;
  }
  a:hover { background: #C9552C; }
  .stamp {
    margin-top: 34px;
    font: 500 10.5px/1 'IBM Plex Mono', ui-monospace, monospace;
    letter-spacing: .14em;
    color: rgba(22, 18, 14, .62);
  }
</style>
</head>
<body>
  <main>
    <img class="mark" src="/assets/logo.png" width="256" height="256" alt="Taste of Africa">
    <h1>That table isn't here.</h1>
    <p>The page you were looking for never made it out of the kitchen.</p>
    <a href="/">Back to the restaurant</a>
    <p class="stamp">ERROR 404 · ORDER NOT FOUND</p>
  </main>
</body>
</html>
